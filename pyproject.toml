[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smtp-code-service"
version = "0.1.0"
description = "A lightweight temporary email and SMTP OTP service"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "GaleBird" }
]
dependencies = [
    "aiosmtpd>=1.4.6",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
smtp-code-service = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
